<!-- CX Projetos Chat Widget -->
<div id="cx-chat-widget">
    <!-- Floating Button -->
    <div id="cx-chat-trigger" title="Fale conosco">
        <svg class="cx-chat-icon-open" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" />
        </svg>
        <svg class="cx-chat-icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </div>

    <!-- Chat Window -->
    <div id="cx-chat-window">
        <div class="cx-chat-header">
            <div class="cx-chat-header-info">
                <button id="cx-chat-back" class="cx-chat-back" aria-label="Voltar" title="Voltar ao início">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <div class="cx-chat-header-title">Atendimento CX Projetos</div>
            </div>
            <button id="cx-chat-close" class="cx-chat-close" aria-label="Fechar chat">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div id="cx-chat-messages" class="cx-chat-messages">
            <!-- Messages will be injected here by JS -->
        </div>
    </div>
</div>
