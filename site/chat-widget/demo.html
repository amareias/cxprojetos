<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Chat Widget - CX Projetos</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Chat Widget CSS -->
    <link rel="stylesheet" href="chat-widget.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #A53749;
            margin-bottom: 1rem;
        }

        p {
            line-height: 1.6;
            color: #666;
        }

        .hint {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>CX Projetos - Chat Widget</h1>
        <p>Olá! Este é um ambiente de demonstração para o widget de chat. Clique no ícone no canto inferior direito para
            testar o fluxo de atendimento.</p>
        <div class="hint">Clique no botão flutuante ↘️</div>
    </div>

    <!-- Chat Widget HTML -->
    <div id="cx-chat-widget">
        <!-- Floating Button -->
        <div id="cx-chat-trigger" title="Fale conosco">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" />
            </svg>
        </div>

        <!-- Chat Window -->
        <div id="cx-chat-window">
            <div class="cx-chat-header">
                <div class="cx-chat-header-info">
                    <div class="cx-chat-header-title">Atendimento CX Projetos</div>
                </div>
                <button id="cx-chat-close" class="cx-chat-close" aria-label="Fechar chat">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div id="cx-chat-messages" class="cx-chat-messages">
                <!-- Messages will be injected here by JS -->
            </div>
        </div>
    </div>

    <!-- Chat Widget JS -->
    <script src="chat-widget.js"></script>
</body>

</html>
